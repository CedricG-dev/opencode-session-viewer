name: Publish to npm
on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # required for npm trusted publishing (OIDC)
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.verify.outputs.valid }}
      npm_tag: ${{ steps.verify.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag is on main or a release branch
        id: verify
        run: |
          git fetch origin +main:refs/remotes/origin/main +refs/heads/release/*:refs/remotes/origin/release/*
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "valid=true" >> $GITHUB_OUTPUT
            echo "npm_tag=latest" >> $GITHUB_OUTPUT
          else
            NPM_TAG=""
            for branch in $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/release/*'); do
              if git merge-base --is-ancestor HEAD "$branch"; then
                major="${branch#origin/release/}"
                major="${major%%.*}"
                NPM_TAG="v${major}-lts"
                break
              fi
            done
            if [ -n "$NPM_TAG" ]; then
              echo "valid=true" >> $GITHUB_OUTPUT
              echo "npm_tag=$NPM_TAG" >> $GITHUB_OUTPUT
            else
              echo "::error::Tag is not on main or a known release/* branch"
              echo "valid=false" >> $GITHUB_OUTPUT
            fi
          fi

  security:
    needs: verify
    if: needs.verify.outputs.valid == 'true'
    uses: ./.github/workflows/security-scan.yml

  publish:
    needs: [verify, security]
    if: needs.verify.outputs.valid == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Node 24 bundles npm 11.19+, which trusted/staged publishing (OIDC) needs (>=11.15.0).
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Set version from tag
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          npm version $TAG --no-git-tag-version

      # Submits to npm's staging area only. A maintainer must still review and
      # approve with 2FA (via `npm stage approve <stage-id>` or npmjs.com)
      # before the version actually goes live on the registry.
      - run: npm stage publish --tag ${{ needs.verify.outputs.npm_tag }}
